name: Verify Splinter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout splinter
        uses: actions/checkout@v4

      - name: Read verus build configuration
        id: config
        run: |
          python3 << 'PYEOF'
          import tomllib, os
          with open("verus-version.toml", "rb") as f:
              config = tomllib.load(f)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              for key in ("verus_repo", "verus_commit", "rust_toolchain"):
                  out.write(f"{key}={config[key]}\n")
          PYEOF

      - name: Install Rust toolchain
        run: |
          rustup install "${{ steps.config.outputs.rust_toolchain }}"
          rustup default "${{ steps.config.outputs.rust_toolchain }}"

      - name: Cache verus build
        id: verus-cache
        uses: actions/cache@v4
        with:
          path: _verus/source/target-verus/release
          key: verus-${{ steps.config.outputs.verus_commit }}

      - name: Build verus
        if: steps.verus-cache.outputs.cache-hit != 'true'
        run: |
          git clone "${{ steps.config.outputs.verus_repo }}" _verus
          cd _verus
          git checkout "${{ steps.config.outputs.verus_commit }}"
          source tools/activate
          cd source
          bash tools/get-z3.sh
          vargo build --release

      - name: Verify splinter
        working-directory: Splinter
        run: |
          ../_verus/source/target-verus/release/verus src/main.rs \
            --expand-errors --multiple-errors 5

      - name: Build splinter
        working-directory: Splinter
        run: |
          export PATH="$GITHUB_WORKSPACE/_verus/source/target-verus/release:$PATH"
          cargo verus build

      - name: Run Crash-Recovery Scripted Regression
        working-directory: Splinter
        run: |
          timeout 120s ./target/debug/verisplinter > /tmp/verisplinter-script.log 2>&1
          status=$?
          if [ "$status" -eq 124 ]; then
            echo "scripted regression timed out"
            tail -n 120 /tmp/verisplinter-script.log
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "scripted regression failed with status $status"
            tail -n 120 /tmp/verisplinter-script.log
            exit "$status"
          fi
          tail -n 80 /tmp/verisplinter-script.log
