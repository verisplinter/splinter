name: Verify Splinter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout splinter
        uses: actions/checkout@v4

      - name: Cache Verus Artifacts
        uses: actions/cache@v4
        with:
          path: |
            _verus/source/target-verus/release
            _verus/source/z3
            _verus/.splinter_ci_verus_commit
          key: ${{ runner.os }}-verus-${{ hashFiles('verus-version.toml') }}

      - name: Verify + Build
        run: python3 Splinter/tools/ci.py --phase verify-build

      - name: Scripted Regression
        run: python3 Splinter/tools/ci.py --phase scripted-test
