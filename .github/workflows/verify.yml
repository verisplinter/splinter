name: Verify Splinter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout splinter
        uses: actions/checkout@v4

      - name: Run Verify + Build + Scripted Regression
        run: python3 Splinter/tools/ci.py
