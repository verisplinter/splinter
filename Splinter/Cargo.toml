[package]
name = "verisplinter"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "verisplinter"
path = "src/main.rs"

[[bin]]
name = "marshalling_test"
path = "src/marshalling_test.rs"

[dependencies]
vstd = "=0.0.0-2026-03-01-0109"
verus_builtin = "=0.0.0-2026-03-01-0109"
verus_builtin_macros = "=0.0.0-2026-03-01-0109"
verus_state_machines_macros = "=0.0.0-2026-03-01-0109"

[package.metadata.verus]
verify = true

[package.metadata.verus.ide]
extra_args = "--expand-errors"
